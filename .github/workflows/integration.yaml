name: integration

on:
  push:
    branches:
      - "main"
      - "release-v**"
  pull_request:
    branches:
      - "*"

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: "1.26"
      - name: Run integration tests
        run: go test -tags=integration ./tests/integration/...
        env:
          KAFKA_CNX_STRING: ${{ secrets.KAFKA_CNX_STRING }}
